<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Planning</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --txt:#1C1C1E; --mute:#8E8E93; --sep:rgba(60,60,67,.18);
    --red:#FF3B30; --blue:#007AFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);
    font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 28px)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;min-height:44px}
  .sub{font-size:15px;color:var(--mute)}
  .link{color:var(--red);font-size:17px}
  .link[hidden]{visibility:hidden;display:inline}
  .seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px}
  .seg[hidden]{display:none}
  .seg button{font-size:13px;font-weight:600;padding:5px 14px;border-radius:7px;color:var(--txt)}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
  .big{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:6px 0 2px}
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
  .weeknav h2{font-size:15px;font-weight:400;color:var(--mute)}
  .arrows{display:flex;gap:4px;align-items:center}
  .arrows .link{font-size:15px;margin-right:6px}
  .arrows .link[hidden]{display:none}
  .weeknav h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .arrow{width:36px;height:36px;border-radius:50%;color:var(--red);font-size:22px;line-height:1;display:grid;place-items:center}
  .arrow:active{background:rgba(0,0,0,.06)}

  .days{display:grid;grid-template-columns:repeat(var(--n,5),1fr);margin:0 -4px 18px;
    border-bottom:.5px solid var(--sep);padding-bottom:10px}
  .day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
  .day span{font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
  .day b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:400}
  .day.today b{color:var(--red);font-weight:600}
  .day.sel b{background:var(--txt);color:#fff;font-weight:600}
  .day.sel.today b{background:var(--red);color:#fff}
  .day i{width:5px;height:5px;border-radius:50%;background:transparent}
  .day.has i{background:#C7C7CC}

  .list{display:flex;flex-direction:column;gap:14px}

  .slot{display:flex;flex-direction:column;gap:7px}
  .cards .empty{height:auto;flex:1}
  .slot.full .cards{height:calc(var(--slot-h) * 2 + 17px + 7px + 14px)}
  .cards{display:flex;flex-direction:column;gap:8px;height:var(--slot-h)}
  .cards .ev{height:auto;flex:1;min-height:0}
  .slot.multi .ev{padding-top:10px;padding-bottom:10px}
  .slot.multi .ev::before{top:10px;bottom:10px}
  .slot.multi .title{-webkit-line-clamp:1}
  .slot.multi .room{font-size:13px}
  .when{height:17px;line-height:17px;font-size:13px;font-weight:500;color:var(--mute);padding-left:4px;font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:6px}
  .when.live{color:var(--red)}
  .when.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
  .ev{height:108px;width:100%;text-align:left;background:var(--card);border-radius:18px;
    padding:16px 18px 16px 20px;position:relative;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04);transition:transform .15s}
  .ev::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 3px 3px 0;background:var(--c)}
  .ev:active{transform:scale(.98)}
  .title{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.2px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .room{font-size:15px;color:var(--mute);display:flex;align-items:center;gap:6px;min-width:0}
  .rt{flex:0 1 auto;min-width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .room .hw{flex-shrink:0}
  .room{overflow:hidden}
  .hw{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--hf);background:var(--hb)}
  .hw.pending{color:var(--mute);background:transparent;box-shadow:inset 0 0 0 1px #C7C7CC;border-radius:999px}
  .ev.cancel{background:#F7F7F9}
  .ev.cancel .title{text-decoration:line-through;color:var(--mute)}
  .ev.cancel::before{background:#C7C7CC}
  .due{margin-top:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04);transition:transform .15s}
  .due:active{transform:scale(.98)}
  .due .k{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
  .due .dl{font-size:15px;line-height:1.45;display:flex;gap:8px;align-items:baseline}
  .due .dl + .dl{margin-top:4px}
  .due .dl i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--hc);transform:translateY(-1px)}
  .due .dl.pending{color:var(--mute)}
  .due .dl.pending i{background:transparent;box-shadow:inset 0 0 0 1.5px #C7C7CC}
  .due .dl span{color:var(--mute)}
  .propose{display:block;margin:26px auto 0;padding:11px 20px;border-radius:999px;background:var(--card);color:var(--red);
    font-size:15px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.06)}
  .propose[hidden]{display:none}
  .propose:active{transform:scale(.97)}
  .sheet{max-height:92vh;overflow-y:auto}
  .sheet h5{font-size:13px;font-weight:600;color:var(--mute);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.3px}
  .row span:first-child{white-space:nowrap}
  .pend{color:var(--mute);font-style:italic}
  .f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-size:17px;min-height:48px}
  .f + .f{border-top:.5px solid var(--sep)}
  .f label{white-space:nowrap}
  .f input,.f select{font:inherit;font-size:16px;color:var(--txt);border:0;background:transparent;text-align:right;min-width:0;flex:1;outline:none}
  .f select{text-align-last:right}
  .f.stack{flex-direction:column;align-items:stretch;gap:6px}
  .f textarea{font:inherit;font-size:16px;border:0;outline:none;resize:none;min-height:64px;background:transparent;color:var(--txt)}
  .f .seg{flex:none}
  .hint{font-size:13px;color:var(--mute);margin:8px 6px 0;line-height:1.4}
  .err{font-size:13px;color:var(--red);margin:10px 6px 0;min-height:18px}
  .send{display:block;width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--red);color:#fff;font-size:17px;font-weight:600}
  .send:disabled{opacity:.5}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .abadge{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(118,118,128,.12);color:var(--txt)}
  .abadge.has{background:var(--red);color:#fff}
  .abadge[hidden]{display:none}
  .alink{display:block;margin:14px auto 0;font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:2px}
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btnrow .propose{margin:26px 0 0}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .act{background:var(--card);border-radius:12px;padding:12px;font-size:15px;font-weight:600;color:var(--txt);text-align:left;
    box-shadow:0 0 0 .5px rgba(0,0,0,.06)}
  .act small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
  .act.on{box-shadow:inset 0 0 0 1.5px var(--txt)}
  .act:disabled{opacity:.5}
  .inl{margin-top:8px;display:flex;gap:8px}
  .inl input{flex:1;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:0;background:var(--card);box-shadow:0 0 0 .5px rgba(0,0,0,.1);outline:none}
  .inl button{padding:10px 14px;border-radius:10px;background:var(--txt);color:#fff;font-size:15px;font-weight:600}
  .pc{background:var(--card);border-radius:14px;padding:14px 16px;margin-top:10px}
  .pc .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:600}
  .pc .pd{font-size:15px;margin-top:6px;color:var(--txt)}
  .pc .pd.none{color:var(--mute);font-style:italic}
  .pc .pw{font-size:13px;color:#B24A00;margin-top:6px}
  .pc .pb{display:flex;gap:8px;margin-top:12px}
  .pc .pb button{flex:1;padding:10px;border-radius:10px;font-size:15px;font-weight:600;background:rgba(118,118,128,.12);color:var(--txt)}
  .pc .pb .ok{background:var(--red);color:#fff}
  .pc .pb button:disabled{opacity:.5}
  .pc .group{margin-top:10px;background:var(--bg)}
  .mini{display:inline-flex;gap:6px;margin-left:8px}
  .mini button{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(118,118,128,.12)}
  .mini .ok{background:var(--red);color:#fff}
  .empty-list{color:var(--mute);text-align:center;padding:30px 0;font-size:15px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
    background:#1C1C1E;color:#fff;font-size:15px;padding:11px 18px;border-radius:999px;transition:.3s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .ev.past{opacity:.45}
  .empty{height:108px;border-radius:18px;display:grid;place-items:center;color:var(--mute);font-size:15px;
    border:1px dashed rgba(60,60,67,.18)}

  footer{margin-top:18px;color:var(--mute);font-size:13px;text-align:center;line-height:1.5}
  .msg{padding:60px 20px;text-align:center;color:var(--mute)}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);
    border-radius:14px 14px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .open .sheet-bg{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .grab{width:36px;height:5px;border-radius:3px;background:#C7C7CC;margin:0 auto 14px}
  .sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .sheet h4{font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
  .sheet .sw{color:var(--mute);font-size:15px;margin:4px 0 18px}
  .close{color:var(--red);font-size:17px;padding-top:2px}
  .group{background:var(--card);border-radius:12px;overflow:hidden}
  .row{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;font-size:17px}
  .row + .row{border-top:.5px solid var(--sep)}
  .row span:last-child{color:var(--mute);text-align:right}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;vertical-align:1px}

  .days{display:none}
  .board{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:16px;align-items:start}
  .col{min-width:0}
  .col h3{display:flex;gap:8px;align-items:baseline;font-size:15px;font-weight:400;color:var(--mute);margin:0 4px 12px}
  .col h3 b{font-size:22px;font-weight:600;color:var(--txt)}
  .col.today h3,.col.today h3 b{color:var(--red)}
  :root{--slot-h:128px}
  .ev,.empty{height:var(--slot-h)}
  .title{font-size:16px;-webkit-line-clamp:3}

  /* téléphone : la même semaine, qu'on fait défiler horizontalement colonne par colonne */
  @media (max-width:899px){
    .board{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 20px;
      margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .board::-webkit-scrollbar{display:none}
    .col{flex:0 0 calc(100% - 70px);scroll-snap-align:start}
    :root{--slot-h:118px}
    .title{font-size:17px}
    .big{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="sub">ING1 SI · EPISEN</span>
    <div class="hdr-r"><button class="abadge" id="adminBadge" hidden></button><div class="seg" id="seg" hidden></div></div>
  </header>
  <h1 class="big" id="bigTitle">Emploi du temps</h1>
  <div class="weeknav">
    <h2 id="weekLabel">…</h2>
    <div class="arrows">
      <button class="link" id="todayBtn" hidden>Aujourd'hui</button>
      <button class="arrow" id="prev" aria-label="Semaine précédente">‹</button>
      <button class="arrow" id="next" aria-label="Semaine suivante">›</button>
    </div>
  </div>
  <nav class="days" id="days"></nav>
  <main class="board" id="board"><div class="msg">Chargement…</div></main>
  <div class="btnrow">
    <button class="propose" id="proposeBtn" hidden>+ Proposer un devoir</button>
    <button class="propose" id="addCourseBtn" hidden>+ Ajouter un cours</button>
  </div>
  <footer id="foot"></footer>
  <button class="alink" id="adminLink" hidden>Mode délégué</button>
</div>
<div class="toast" id="toast"></div>
<div id="sheetRoot">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<script>
const DAYS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const DAYS_LONG = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const PALETTE = ["#007AFF","#34C759","#FF9500","#AF52DE","#30B0C7","#5856D6","#A2845E","#FFCC00","#00C7BE","#8E8E93"];
const MONTHS_LONG = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

const PIN = `<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5c0 3.2 3.8 7.6 4.1 8a.5.5 0 0 0 .8 0c.3-.4 4.1-4.8 4.1-8A4.5 4.5 0 0 0 8 1.5Zm0 6.2a1.7 1.7 0 1 1 0-3.4 1.7 1.7 0 0 1 0 3.4Z"/></svg>`;
const isCompanyDay = e => /journ[ée]e en entreprise/i.test(e.title);

// Adresse du script Google (Déployer > Application web). Laisser vide pour désactiver les devoirs.
const HW_API = "https://script.google.com/macros/s/AKfycbyy2vjVQKT4PeeumACXm7iTXn0gIEpwbUXyXPkjpeZVUpRJSDtGORvdykABMXOi45s/exec";
// Types de devoirs : couleur de la pastille (fond, texte) et du point
const HW_TYPES = {
  "Interro":    {bg: "#FFE3E1", fg: "#C0211A", dot: "#FF3B30"},
  "À rendre":   {bg: "#E0EEFF", fg: "#0A4FA8", dot: "#007AFF"},
  "À préparer": {bg: "#FFF4C2", fg: "#8A6500", dot: "#FFCC00"},
};
// Modifications de cours faites par les délégués
const CHG = {
  cancel: {label: "Annulé",         bg: "#E5E5EA", fg: "#3A3A3C"},
  visio:  {label: "Visio",          bg: "#EFE6FF", fg: "#6A2FC4"},
  room:   {label: "Salle modifiée", bg: "#DDF3F6", fg: "#0A6B78"},
  add:    {label: "Ajouté",         bg: "#DFF4E4", fg: "#1D7633"},
  note:   {label: "Info",           bg: "#E7ECF4", fg: "#3A4A63"},
};
const chgPill = m => `<span class="hw" style="--hb:${CHG[m.action].bg};--hf:${CHG[m.action].fg}">${CHG[m.action].label}</span>`;
const hasMod = (e, a) => (e.mods || []).some(m => m.action === a);
const modVal = (e, a) => (e.mods || []).find(m => m.action === a)?.value;
const hwStyle = h => { const t = HW_TYPES[h.type] || HW_TYPES["À préparer"]; return `--hb:${t.bg};--hf:${t.fg};--hc:${t.dot}`; };
const subjectKey = code => (codeTitle[code] || code || "").toLowerCase();
const sameSubject = (a, b) => a === b || subjectKey(a) === subjectKey(b);
const hwLabel = h => esc(h.type) + (h.status === "pending" ? " ?" : "");
const $ = id => document.getElementById(id);
let scrollPending = true;
let allChanges = [], colorOf = () => "#8E8E93";
let allHomework = [], homework = [], dueBoxes = [], hwByCourse = {}, codeTitle = {};
let events = [], allEvents = [], tracks = [], track = null, updated = null, weekStart, selDay;

function readTrack(){
  const p = new URLSearchParams(location.search).get("p");
  if (p) return p.toUpperCase();
  try { return localStorage.getItem("edt-track"); } catch { return null; }
}
// ADE garde la priorité : une modif dont le cours n'existe plus est ignorée,
// un cours ajouté disparaît s'il apparaît pour de vrai dans ADE au même moment.
function applyChanges(list, changes){
  const out = list.map(e => ({...e, mods: []}));
  changes.forEach(c => {
    const d = new Date(c.date + "T00:00:00");
    const at = hhmm => { const [H, M] = hhmm.split(":").map(Number); const x = new Date(d); x.setHours(H, M); return x; };
    if (c.action === "add"){
      const s = at(c.start), e = at(c.end);
      if (out.some(x => sameSubject(x.code, c.code) && x.s < e && x.e > s)) return;
      out.push({id: "chg-" + c.id, s, e, start: s.toISOString(), end: e.toISOString(), code: c.code,
        title: c.title || codeTitle[c.code] || c.code, type: "", room: c.room || "", teachers: [], groups: [],
        tracks: c.tracks, c: colorOf(c.code), mods: [{action: "add", id: c.id}]});
      return;
    }
    const target = out.find(x => sameDay(x.s, d) && sameSubject(x.code, c.code) &&
      (!c.slot || (c.slot === "matin") === (x.s.getHours() < 13)));
    if (target) target.mods.push({action: c.action, value: c.value || "", id: c.id});
  });
  return out.sort((a, b) => a.s - b.s);
}
function setTrack(t){
  track = t;
  try { localStorage.setItem("edt-track", t); } catch {}
  events = applyChanges(allEvents.filter(e => !e.tracks || e.tracks.includes(t)),
    allChanges.filter(c => !c.tracks || c.tracks.includes(t)));
  homework = dedupe(allHomework.filter(h => !h.tracks || h.tracks.includes(t)));
  $("seg").innerHTML = tracks.map(x => `<button class="${x === t ? "on" : ""}" data-t="${x}">${x}</button>`).join("");
  render();
}

const pad = n => String(n).padStart(2,"0");
const hm = d => `${d.getHours()}h${pad(d.getMinutes())}`;
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function defaultView(){
  const now = new Date();
  let d = new Date(now); d.setHours(0,0,0,0);
  // le week-end, ou après le dernier cours du vendredi, on montre la semaine suivante
  const dow = now.getDay();
  if (dow === 6 || dow === 0) d = mondayOf(addDays(d, 7));
  weekStart = mondayOf(d);
  selDay = (dow >= 1 && dow <= 5) ? d : weekStart;
}

function weekEvents(){
  const end = addDays(weekStart, 7);
  return events.filter(e => e.s >= weekStart && e.s < end);
}

function render(){
  const now = new Date();
  const wk = weekEvents();
  const hasSat = wk.some(e => e.s.getDay() === 6);
  const n = hasSat ? 6 : 5;
  document.documentElement.style.setProperty("--n", n);

  const last = addDays(weekStart, n-1);
  const label = weekStart.getMonth() === last.getMonth()
    ? `${weekStart.getDate()} – ${last.getDate()} ${MONTHS_LONG[last.getMonth()]}`
    : `${weekStart.getDate()} ${MONTHS[weekStart.getMonth()]} – ${last.getDate()} ${MONTHS[last.getMonth()]}`;
  const thisWeek = mondayOf(now).getTime() === weekStart.getTime();
  $("weekLabel").textContent = (thisWeek ? "Cette semaine · " : "Semaine du ") + label;
  $("todayBtn").hidden = mondayOf(addDays(now, now.getDay()===6||now.getDay()===0 ? 7 : 0)).getTime() === weekStart.getTime();

  if (selDay < weekStart || selDay >= addDays(weekStart, n)) selDay = new Date(weekStart);

  // devoirs : pastille sur le cours de la matière ce jour-là, sinon case « À prévoir » sous le jour
  // (le week-end va sous le dernier jour affiché)
  hwByCourse = {}; dueBoxes = Array.from({length: n}, () => []);
  homework.filter(h => h.d >= weekStart && h.d < addDays(weekStart, 7)).forEach(h => {
    const course = wk.find(e => sameDay(e.s, h.d) && sameSubject(e.code, h.code) && (!h.due || (h.due >= e.s && h.due <= e.e)));
    if (course) (hwByCourse[course.id] ||= []).push(h);
    else dueBoxes[Math.min(Math.round((h.d - weekStart) / 864e5), n - 1)].push(h);
  });
  let pills = "", cols = "";
  for (let i = 0; i < n; i++){
    const d = addDays(weekStart, i);
    const list = wk.filter(e => sameDay(e.s, d));
    const cls = [sameDay(d, now) ? "today" : "", sameDay(d, selDay) ? "sel" : "", list.length ? "has" : ""].join(" ");
    pills += `<button class="day ${cls}" data-i="${i}"><span>${DAYS[d.getDay()]}</span><b>${d.getDate()}</b><i></i></button>`;

    // deux créneaux fixes par jour (matin / après-midi) pour que tout reste aligné d'un jour à l'autre.
    // Un créneau vide reste invisible ; un événement qui couvre toute la journée occupe les deux créneaux.
    const card = (e, n) => {
      const past = now >= e.e;
      const room = hasMod(e, "visio") ? "En visio" : (modVal(e, "room") || e.room);
      e = {...e, room};
      const sub = n > 1 ? `${hm(e.s)} – ${hm(e.e)}${e.room ? " · " + esc(e.room) : ""}` : esc(e.room || "Salle non indiquée");
      // au plus 2 pastilles sur la carte (les plus importantes), le reste en « +N » : tout est dans la fiche
      const order = ["cancel", "add", "visio", "room"];
      const mods = e.mods || [];
      const all = [
        ...mods.filter(m => m.action !== "note").sort((a, b) => order.indexOf(a.action) - order.indexOf(b.action)).map(chgPill),
        ...(hwByCourse[e.id] || []).map(h => `<span class="hw ${h.status === "pending" ? "pending" : ""}" style="${hwStyle(h)}">${hwLabel(h)}</span>`),
        ...mods.filter(m => m.action === "note").map(chgPill),
      ];
      const hws = all.length > 2 ? all.slice(0, 1).join("") + `<span class="hw" style="--hb:#EBEBEF;--hf:#55555C">+${all.length - 1}</span>` : all.join("");
      return `<button class="ev ${past ? "past" : ""} ${hasMod(e, "cancel") ? "cancel" : ""}" style="--c:${e.c}" data-id="${esc(e.id)}">
          <div class="title">${esc(e.title)}</div>
          <div class="room"><span class="rt">${sub}</span>${hws}</div>
        </button>`;
    };
    const slotHtml = (items, cls = "") => {
      const n = items.length;
      if (!n) return `<div class="slot ${cls}"><div class="when">&nbsp;</div><div class="cards"><div class="empty">Pas de cours</div></div></div>`;
      const live = items.some(e => now >= e.s && now < e.e && !hasMod(e, "cancel"));
      const first = items[0], last = items.reduce((a, b) => b.e > a.e ? b : a);
      // pas d'horaire pour les journées en entreprise : ça dépend de chaque entreprise
      const label = items.every(isCompanyDay) ? "&nbsp;" : `${hm(first.s)} – ${hm(last.e)}${live ? " · En cours" : ""}`;
      return `<div class="slot ${n > 1 ? "multi" : ""} ${cls}">
        <div class="when ${live && label !== "&nbsp;" ? "live" : ""}">${label}</div>
        <div class="cards">${items.map(e => card(e, n)).join("")}</div></div>`;
    };
    const spansDay = e => e.s.getHours() < 13 && (e.e.getHours() > 14 || (e.e.getHours() === 14 && e.e.getMinutes() > 0));
    let body = "";
    if (!list.length) {
      body = slotHtml([], "full");
    } else if (list.every(spansDay)) {
      body = slotHtml(list, "full");
    } else {
      body = slotHtml(list.filter(e => e.s.getHours() < 13)) + slotHtml(list.filter(e => e.s.getHours() >= 13));
    }
    if (dueBoxes[i].length){
      const lines = dueBoxes[i].map(h => {
        const other = !sameDay(h.d, d) ? `${DAYS_LONG[h.d.getDay()][0].toUpperCase()}${DAYS_LONG[h.d.getDay()].slice(1)} ` : "";
        const when = (other || h.due) ? ` · <span>${other}${h.due ? hm(h.due) : ""}</span>` : "";
        return `<div class="dl ${h.status === "pending" ? "pending" : ""}" style="${hwStyle(h)}"><i></i><div>${hwLabel(h)} ${esc(h.code)}${when}</div></div>`;
      }).join("");
      body += `<button class="due" data-due="${i}"><div class="k">À prévoir</div>${lines}</button>`;
    }
    cols += `<section class="col ${sameDay(d, selDay) ? "sel" : ""} ${sameDay(d, now) ? "today" : ""}">
      <h3><span>${DAYS_LONG[d.getDay()]}</span><b>${d.getDate()}</b></h3><div class="list">${body}</div></section>`;
  }
  const big = `${MONTHS_LONG[weekStart.getMonth()][0].toUpperCase()}${MONTHS_LONG[weekStart.getMonth()].slice(1)} ${weekStart.getFullYear()}`;
  $("bigTitle").textContent = big;
  $("days").innerHTML = pills;
  $("board").innerHTML = cols;
  if (scrollPending){
    scrollPending = false;
    const target = $("board").querySelector(".col.today") || $("board").querySelector(".col");
    if (target) $("board").scrollLeft = target.offsetLeft - 20;
  }

  const ref = lastCheck || updated;
  if (ref && checkDone){
    const min = Math.round((now - ref) / 60000);
    const ago = min < 1 ? "à l'instant" : min < 60 ? `il y a ${min} min` : min < 1440 ? `il y a ${Math.round(min/60)} h` : `le ${ref.getDate()} ${MONTHS[ref.getMonth()]}`;
    const verb = lastCheck ? "Vérifié" : "Mis à jour";
    const warn = lastFailed ? "⚠️ Dernière synchronisation échouée · " : "";
    $("foot").innerHTML = `${warn}${verb} ${ago} depuis ADE<br>En cas de doute, ADE et le groupe Annonces font foi.`;
  }
}

let lastCheck = null, lastFailed = false, checkDone = false;

// un seul devoir affiché par (jour, matière, type) : le validé l'emporte sur les propositions
function dedupe(list){
  const best = {};
  list.forEach(h => {
    const k = `${h.date}|${subjectKey(h.code)}|${h.type}`;
    if (!best[k] || (best[k].status === "pending" && h.status === "ok")) best[k] = h;
  });
  return Object.values(best);
}
function prepHomework(items){
  return items.map(h => {
    const d = new Date(h.date + "T00:00:00");
    let due = null;
    if (h.time){ const [H, M] = h.time.split(":").map(Number); due = new Date(d); due.setHours(H, M); }
    return {...h, d, due};
  });
}
// Devoirs et modifs : affichés tout de suite depuis une copie (robot GitHub ou téléphone),
// puis remplacés par la version en direct de Google dès qu'elle arrive.
let hwStamp = 0;
function applyHW(data, live = false){
  if (!data || !data.items) return;
  const t = Date.parse(data.updated || "") || 0;
  if (!live && t <= hwStamp) return; // une copie plus ancienne que ce qui est affiché ne remplace rien
  hwStamp = live ? Date.now() : t;
  allHomework = prepHomework(data.items || []);
  allChanges = data.changes || [];
  setTrack(track);
}
async function loadHomework(prefetched){
  if (!HW_API) return;
  try {
    const data = prefetched ? await prefetched : await (await fetch(HW_API)).json();
    if (!data || !data.items) return;
    applyHW(data, true);
    try { localStorage.setItem("edt-hw", JSON.stringify(data)); } catch {}
  } catch {}
}

// Envoi « optimiste » : la proposition s'affiche tout de suite, l'envoi à Google se fait en arrière-plan.
let draft = null; // garde la saisie si l'envoi échoue, pour ne pas tout retaper
async function submitPropose(ev){
  ev.preventDefault();
  const pick = name => $("sheet").querySelector(`.seg[data-name="${name}"] .on`)?.dataset.v;
  const p = {
    type: pick("type"), track: pick("track"),
    code: $("pfCode").value, date: $("pfDate").value, time: $("pfTime").value,
    detail: $("pfDetail").value.trim(), website: $("pfWeb").value,
  };
  if (!p.code) return $("pfErr").textContent = "Choisis la matière.";
  if (!p.date) return $("pfErr").textContent = "Choisis la date.";
  if (admin) return publishHomework(p);
  // limite douce côté téléphone : 6 propositions par heure
  let sent = [];
  try { sent = JSON.parse(localStorage.getItem("edt-sent") || "[]").filter(t => Date.now() - t < 36e5); } catch {}
  if (sent.length >= 6) return $("pfErr").textContent = "Tu as déjà envoyé beaucoup de propositions, réessaie plus tard.";
  try { localStorage.setItem("edt-sent", JSON.stringify([...sent, Date.now()])); } catch {}

  // 1. affichage immédiat en gris
  const tmpId = "tmp-" + Date.now();
  allHomework.push(...prepHomework([{id: tmpId, date: p.date, time: p.time || null, code: p.code, type: p.type,
    tracks: p.track === "Les deux" ? ["FISE", "FISA"] : [p.track], status: "pending", detail: null}]));
  draft = null;
  closeSheet(); setTrack(track); toast("Merci, c'est envoyé aux délégués");

  // 2. envoi en arrière-plan
  try {
    const r = await fetch(HW_API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(p)});
    const res = await r.json();
    if (!res.ok) throw new Error(res.error);
    const h = allHomework.find(x => x.id === tmpId); if (h) h.id = res.id;
  } catch (err) {
    // 3. en cas d'échec : on retire la proposition grise et on garde la saisie
    allHomework = allHomework.filter(x => x.id !== tmpId);
    draft = p; setTrack(track);
    const msg = {plein: "Trop de propositions en attente, réessaie plus tard."}[err.message];
    toast(msg || "L'envoi n'a pas marché, réessaie", 5000);
  }
}

/* ---- validation des propositions ---- */
function subjectOptions(sel){
  const byTitle = {};
  Object.keys(codeTitle).sort().forEach(c => { if (!/journ[ée]e en entreprise/i.test(codeTitle[c]) && !byTitle[subjectKey(c)]) byTitle[subjectKey(c)] = c; });
  const codes = Object.values(byTitle).sort((a, b) => codeTitle[a].localeCompare(codeTitle[b], "fr"));
  if (sel && !codes.some(c => sameSubject(c, sel))) codes.unshift(sel);
  return codes.map(c => `<option value="${esc(c)}" ${sel && sameSubject(c, sel) ? "selected" : ""}>${esc(codeTitle[c] || c)}</option>`).join("");
}
const segHtml = (name, opts, on) => `<div class="seg" data-name="${name}">${opts.map(o => `<button type="button" class="${o === on ? "on" : ""}" data-v="${o}">${o}</button>`).join("")}</div>`;
function bindSegs(root){ root.querySelectorAll(".seg").forEach(seg => seg.onclick = ev => {
  const b = ev.target.closest("button"); if (!b) return; seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }); }
const segVal = (root, name) => root.querySelector(`.seg[data-name="${name}"] .on`)?.dataset.v;
function fmtDay(iso, time){ const d = new Date(iso + "T00:00:00"); return `${DAYS[d.getDay()].toLowerCase()}. ${d.getDate()} ${MONTHS[d.getMonth()]}${time ? " · " + time.replace(":", "h") : ""}`; }

function openPending(){
  const card = p => `<div class="pc" data-id="${esc(p.id)}">
      <div class="ph"><span class="hw" style="${hwStyle(p)}">${esc(p.type)}</span>${esc(codeTitle[p.code] || p.code)}</div>
      <div class="sw" style="margin:4px 0 0">${fmtDay(p.date, p.time)} · ${esc(p.track)}</div>
      <div class="pd ${p.detail ? "" : "none"}">${p.detail ? esc(p.detail) : "Sans détail"}</div>
      ${p.remark ? `<div class="pw">⚠️ ${esc(p.remark)}</div>` : ""}
      <div class="pb"><button data-a="refuse">Refuser</button><button data-a="edit">Modifier</button><button class="ok" data-a="ok">Valider</button></div>
    </div>`;
  $("sheet").innerHTML = `<div class="grab"></div>
    <div class="top"><h4>À valider</h4><button class="close" id="closeBtn">OK</button></div>
    <p class="sw">Les propositions de la classe. Elles s'affichent en gris, sans détail, jusqu'à ta décision.</p>
    ${pending.length ? pending.map(card).join("") : `<div class="empty-list">Rien à valider pour l'instant</div>`}
    <button class="alink" id="logoutBtn">Quitter le mode délégué</button>`;
  $("closeBtn").onclick = closeSheet;
  $("logoutBtn").onclick = () => { closeSheet(); logout(); toast("Mode délégué désactivé"); };
  $("sheet").querySelectorAll(".pc").forEach(el => el.onclick = ev => {
    const b = ev.target.closest("button[data-a]"); if (!b) return;
    const p = pending.find(x => x.id === el.dataset.id);
    if (b.dataset.a === "edit") return editPending(el, p);
    review(p.id, b.dataset.a, null, el);
  });
  $("sheetRoot").classList.add("open");
}
function editPending(el, p){
  el.innerHTML = `<div class="group">
      <div class="f"><label>Type</label>${segHtml("type", Object.keys(HW_TYPES), p.type)}</div>
      <div class="f"><label>Matière</label><select data-k="code">${subjectOptions(p.code)}</select></div>
      <div class="f"><label>Date</label><input type="date" data-k="date" value="${esc(p.date)}"></div>
      <div class="f"><label>Heure limite</label><input type="time" data-k="time" value="${esc(p.time || "")}"></div>
      <div class="f"><label>Parcours</label>${segHtml("track", ["FISE", "FISA", "Les deux"], p.track)}</div>
      <div class="f stack"><label>Détail</label><textarea data-k="detail" maxlength="200">${esc(p.detail || "")}</textarea></div>
    </div>
    <div class="pb"><button data-a="cancel">Annuler</button><button class="ok" data-a="save">Enregistrer et valider</button></div>`;
  bindSegs(el);
  el.onclick = ev => {
    const b = ev.target.closest("button[data-a]"); if (!b) return;
    if (b.dataset.a === "cancel") return openPending();
    const v = k => el.querySelector(`[data-k="${k}"]`).value;
    review(p.id, "ok", {type: segVal(el, "type"), track: segVal(el, "track"), code: v("code"), date: v("date"), time: v("time"), detail: v("detail").trim()}, el);
  };
}
async function review(id, decision, fields, el){
  el && el.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    await adminApi({action: "review", id, decision, fields});
    toast(decision === "ok" ? "Validé" : "Refusé");
    pending = pending.filter(x => x.id !== id);
    updateAdminUI();
    if (el) openPending();
    loadHomework().then(refreshPending);
  } catch (err) { adminError(err); el && el.querySelectorAll("button").forEach(b => b.disabled = false); }
}

/* ---- actions sur un cours ---- */
function adminActions(e){
  const m = a => (e.mods || []).find(x => x.action === a);
  if (hasMod(e, "add")) return `<h5>Actions délégué</h5><div class="acts"><button class="act" data-op="del" data-id="${esc(m("add").id)}">Supprimer ce cours<small>Ajouté par les délégués</small></button></div>`;
  const btn = (a, on, off, sub) => m(a)
    ? `<button class="act on" data-op="del" data-id="${esc(m(a).id)}">${off}<small>${sub}</small></button>`
    : `<button class="act" data-op="${a}">${on}</button>`;
  return `<h5>Actions délégué</h5><div class="acts">
      ${btn("cancel", "Annuler le cours", "Rétablir le cours", "Actuellement annulé")}
      ${btn("visio", "Passer en visio", "Retirer la visio", "Actuellement en visio")}
      ${btn("room", "Changer de salle", "Salle d'origine", "Nouvelle salle : " + esc(m("room")?.value || ""))}
      ${btn("note", "Ajouter une note", "Retirer la note", esc(m("note")?.value || ""))}
    </div><div id="actInput"></div>`;
}
function bindAdminActions(e){
  $("sheet").querySelectorAll(".act").forEach(b => b.onclick = () => {
    const op = b.dataset.op;
    if (op === "del") return saveChange(e, {op: "remove", id: b.dataset.id});
    if (op === "room" || op === "note"){
      $("actInput").innerHTML = `<div class="inl"><input id="actVal" maxlength="${op === "room" ? 40 : 120}" placeholder="${op === "room" ? "B204" : "Apportez votre ordinateur"}"><button id="actOk">OK</button></div>`;
      $("actVal").focus();
      $("actOk").onclick = () => { const v = $("actVal").value.trim(); if (v) saveChange(e, {op: "set", action: op, value: v}); };
      return;
    }
    saveChange(e, {op: "set", action: op});
  });
}
async function saveChange(e, {op, action, value, id}){
  $("sheet").querySelectorAll(".act, #actOk").forEach(b => b.disabled = true);
  const track = !e.tracks || e.tracks.length > 1 ? "Les deux" : e.tracks[0];
  try {
    if (op === "remove") await adminApi({action: "change", op, id});
    else await adminApi({action: "change", op, change: {date: isoDate(e.s), slot: e.s.getHours() < 13 ? "matin" : "aprem", code: e.code, track, action, value: value || ""}});
    toast("C'est en ligne pour toute la classe");
    await loadHomework();
    const again = events.find(x => x.id === e.id);
    again ? openSheet(again.id) : closeSheet();
  } catch (err) { adminError(err); $("sheet").querySelectorAll(".act, #actOk").forEach(b => b.disabled = false); }
}

/* ---- ajouter un cours ---- */
function openAddCourse(){
  const today = new Date();
  $("sheet").innerHTML = `<div class="grab"></div>
    <div class="top"><h4>Ajouter un cours</h4><button class="close" id="closeBtn">Annuler</button></div>
    <p class="sw">Pour un cours qui n'est pas (encore) dans ADE. S'il y apparaît plus tard, ton ajout disparaît tout seul.</p>
    <form id="af" novalidate><div class="group">
      <div class="f"><label for="afCode">Matière</label><select id="afCode"><option value="">Choisir</option>${subjectOptions()}</select></div>
      <div class="f"><label for="afTitle">Titre</label><input id="afTitle" maxlength="60" placeholder="Facultatif, ex. Rattrapage"></div>
      <div class="f"><label for="afDate">Date</label><input type="date" id="afDate" value="${isoDate(today)}"></div>
      <div class="f"><label for="afStart">Début</label><input type="time" id="afStart" value="14:00"></div>
      <div class="f"><label for="afEnd">Fin</label><input type="time" id="afEnd" value="16:00"></div>
      <div class="f"><label for="afRoom">Salle</label><input id="afRoom" maxlength="40" placeholder="TD 3 St-Simon"></div>
      <div class="f"><label>Parcours</label>${segHtml("track", ["FISE", "FISA", "Les deux"], "Les deux")}</div>
    </div><p class="err" id="afErr"></p><button class="send" id="afSend" type="submit">Ajouter</button></form>`;
  $("closeBtn").onclick = closeSheet;
  bindSegs($("sheet"));
  $("af").onsubmit = async ev => {
    ev.preventDefault();
    const code = $("afCode").value, date = $("afDate").value, start = $("afStart").value, end = $("afEnd").value;
    if (!code) return $("afErr").textContent = "Choisis la matière.";
    if (!date || !start || !end) return $("afErr").textContent = "Indique la date et les horaires.";
    if (end <= start) return $("afErr").textContent = "L'heure de fin doit être après le début.";
    const t = $("afTitle").value.trim();
    $("afSend").disabled = true; $("afSend").textContent = "Ajout…";
    try {
      await adminApi({action: "change", op: "set", change: {action: "add", date, code, start, end,
        title: t ? `${codeTitle[code] || code} (${t.toLowerCase()})` : "", room: $("afRoom").value.trim(), track: segVal($("sheet"), "track")}});
      closeSheet(); toast("Cours ajouté pour toute la classe"); await loadHomework();
    } catch (err) { adminError(err); $("afSend").disabled = false; $("afSend").textContent = "Ajouter"; }
  };
  $("sheetRoot").classList.add("open");
}

/* ---- devoirs publiés directement, modifiés ou supprimés par un délégué ---- */
async function publishHomework(p){
  const tmpId = "tmp-" + Date.now();
  allHomework.push(...prepHomework([{id: tmpId, date: p.date, time: p.time || null, code: p.code, type: p.type,
    tracks: p.track === "Les deux" ? ["FISE", "FISA"] : [p.track], status: "ok", detail: p.detail}]));
  draft = null; closeSheet(); setTrack(track); toast("Publié pour toute la classe");
  try { await adminApi({action: "addhw", ...p}); loadHomework(); }
  catch (err) { allHomework = allHomework.filter(x => x.id !== tmpId); draft = p; setTrack(track); adminError(err); }
}
function openEditHW(id){
  const h = allHomework.find(x => x.id === id) || {};
  const p = pending.find(x => x.id === id);
  const v = {type: h.type, code: h.code, date: h.date, time: h.time || "", detail: (p && p.detail) || h.detail || "",
    track: !h.tracks || h.tracks.length > 1 ? "Les deux" : h.tracks[0]};
  $("sheet").innerHTML = `<div class="grab"></div>
    <div class="top"><h4>Modifier le devoir</h4><button class="close" id="closeBtn">Annuler</button></div>
    <div class="group" id="ehw">
      <div class="f"><label>Type</label>${segHtml("type", Object.keys(HW_TYPES), v.type)}</div>
      <div class="f"><label>Matière</label><select data-k="code">${subjectOptions(v.code)}</select></div>
      <div class="f"><label>Date</label><input type="date" data-k="date" value="${esc(v.date)}"></div>
      <div class="f"><label>Heure limite</label><input type="time" data-k="time" value="${esc(v.time)}"></div>
      <div class="f"><label>Parcours</label>${segHtml("track", ["FISE", "FISA", "Les deux"], v.track)}</div>
      <div class="f stack"><label>Détail</label><textarea data-k="detail" maxlength="200">${esc(v.detail)}</textarea></div>
    </div>
    <button class="send" id="ehwSave">Enregistrer</button>
    <button class="alink" id="ehwDel" style="color:var(--red)">Supprimer ce devoir</button>`;
  const root = $("ehw"); bindSegs(root);
  $("closeBtn").onclick = closeSheet;
  $("ehwSave").onclick = () => {
    const g = k => root.querySelector(`[data-k="${k}"]`).value;
    review(id, "ok", {type: segVal(root, "type"), track: segVal(root, "track"), code: g("code"), date: g("date"), time: g("time"), detail: g("detail").trim()}, null)
      .then(closeSheet);
  };
  $("ehwDel").onclick = () => review(id, "refuse", null, null).then(closeSheet);
  $("sheetRoot").classList.add("open");
}
// boutons des devoirs dans les fiches (cours et « À prévoir »), en mode délégué
$("sheet").addEventListener("click", ev => {
  const rv = ev.target.closest("[data-rv]");
  if (rv) { ev.stopPropagation(); return review(rv.dataset.id, rv.dataset.rv, null, null).then(closeSheet); }
  const ed = ev.target.closest("[data-ed]");
  if (ed) { ev.stopPropagation(); openEditHW(ed.dataset.ed); }
});

$("adminLink").onclick = () => admin ? (logout(), toast("Mode délégué désactivé")) : openLogin();
$("adminBadge").onclick = openPending;
$("addCourseBtn").onclick = openAddCourse;
$("proposeBtn").onclick = openPropose;
$("proposeBtn").hidden = !HW_API;
updateAdminUI();

const closeSheet = () => $("sheetRoot").classList.remove("open");

function go(deltaWeeks){
  scrollPending = true;
  weekStart = addDays(weekStart, 7*deltaWeeks);
  selDay = new Date(weekStart);
  render();
}
function shiftDay(delta){
  const n = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--n")) || 5;
  const i = Math.round((selDay - weekStart) / 864e5) + delta;
  if (i < 0) { go(-1); selDay = addDays(weekStart, n-1); render(); }
  else if (i >= n) go(1);
  else { selDay = addDays(weekStart, i); render(); }
}

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("todayBtn").onclick = () => { defaultView(); scrollPending = true; render(); };
$("days").onclick = ev => { const b = ev.target.closest(".day"); if (b){ selDay = addDays(weekStart, +b.dataset.i); render(); } };
$("board").onclick = ev => {
  const b = ev.target.closest(".ev"); if (b) return openSheet(b.dataset.id);
  const d = ev.target.closest(".due"); if (d) openDue(+d.dataset.due);
};
$("sheetBg").onclick = closeSheet;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if ($("sheetRoot").classList.contains("open")) return;
  if (e.key === "ArrowLeft") shiftDay(-1);
  if (e.key === "ArrowRight") shiftDay(1);
});
function load(data){
  updated = data.updated ? new Date(data.updated) : null;
  // une couleur différente par matière : on attribue la palette dans l'ordre alphabétique des codes
  const keys = [...new Set((data.events || []).map(e => e.code || e.title))].sort();
  const col = k => PALETTE[Math.max(keys.indexOf(k), 0) % PALETTE.length];
  colorOf = col;
  allEvents = (data.events || []).map(e => ({...e, s: new Date(e.start), e: new Date(e.end), c: col(e.code || e.title)}));
  allEvents.forEach(e => { if (e.code && !codeTitle[e.code]) codeTitle[e.code] = e.title; });
  tracks = data.tracks || [];
  $("seg").hidden = tracks.length < 2;
  const saved = readTrack();
  setTrack(tracks.includes(saved) ? saved : (tracks.includes("FISE") ? "FISE" : tracks[0]));
}
$("seg").onclick = ev => { const b = ev.target.closest("button"); if (b && b.dataset.t !== track) setTrack(b.dataset.t); };

(async () => {
  defaultView();
  // la demande à Google part tout de suite, en parallèle de l'emploi du temps
  const hwLive = HW_API ? fetch(HW_API).then(r => r.json()).catch(() => null) : null;
  try {
    if (window.EDT_DATA) return load(window.EDT_DATA);
    const r = await fetch("data/events.json?v=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    load(data);
    // affichage immédiat avec la copie la plus récente : celle du robot ou celle gardée par le téléphone
    let local = null;
    try { local = JSON.parse(localStorage.getItem("edt-hw") || "null"); } catch {}
    [data.homework, local].filter(Boolean)
      .sort((a, b) => (Date.parse(a.updated || "") || 0) - (Date.parse(b.updated || "") || 0))
      .forEach(c => applyHW(c));
    loadLastCheck();
    loadHomework(hwLive).then(refreshPending);
  } catch (err) {
    $("board").innerHTML = `<div class="msg">Impossible de charger l'emploi du temps pour le moment.<br>Réessaie dans quelques minutes.</div>`;
  }
  setInterval(() => { render(); }, 60000);
  setInterval(() => { if (admin) refreshPending(); }, 120000);
})();
</script>
